name: Python tests

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: "2.2.1"

      - name: Install dependencies
        run: poetry install

      - name: Run tests with coverage
        run: PYTHONPATH=src poetry run pytest --cov=moirestrain --cov-report=xml

      - name: Run microstrain benchmark example
        run: PYTHONPATH=src poetry run python examples/benchmark_microstrain.py --output-dir data --no-figure
